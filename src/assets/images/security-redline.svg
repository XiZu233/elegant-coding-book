<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <style>
    .bg { fill: #f9fafb; }
    .prohibition-circle { fill: none; stroke: #dc2626; stroke-width: 6; }
    .prohibition-line { stroke: #dc2626; stroke-width: 6; }
    .inner-bg { fill: #fef2f2; }
    .danger-item { fill: #ffffff; stroke: #fecaca; stroke-width: 1.5; }
    .danger-num { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #dc2626; }
    .danger-text { font-family: Arial, sans-serif; font-size: 14px; fill: #1f2937; }
    .danger-code { font-family: "Courier New", monospace; font-size: 13px; fill: #dc2626; font-weight: bold; }
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #dc2626; text-anchor: middle; }
    .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; text-anchor: middle; }
    .bottom-text { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .warning-icon { fill: #dc2626; }
  </style>

  <rect class="bg" x="0" y="0" width="700" height="480" rx="12"/>

  <!-- Title -->
  <text class="title" x="350" y="45">AI 安全红线</text>
  <text class="subtitle" x="350" y="65">以下行为，绝对禁止</text>

  <!-- Prohibition circle background -->
  <circle class="inner-bg" cx="350" cy="230" r="155"/>
  <circle class="prohibition-circle" cx="350" cy="230" r="150"/>
  <line class="prohibition-line" x1="245" y1="125" x2="455" y2="335"/>

  <!-- Danger item 1: API Key pasted to AI -->
  <rect class="danger-item" x="120" y="110" width="220" height="50" rx="8"/>
  <text class="danger-num" x="135" y="142">①</text>
  <text class="danger-text" x="160" y="132">把 API Key</text>
  <text class="danger-text" x="160" y="150">粘贴给 AI</text>

  <!-- Danger item 2: AI processes privacy data -->
  <rect class="danger-item" x="360" y="110" width="220" height="50" rx="8"/>
  <text class="danger-num" x="375" y="142">②</text>
  <text class="danger-text" x="400" y="132">让 AI 处理</text>
  <text class="danger-text" x="400" y="150">用户隐私数据</text>

  <!-- Danger item 3: rm -rf -->
  <rect class="danger-item" x="120" y="300" width="220" height="50" rx="8"/>
  <text class="danger-num" x="135" y="332">③</text>
  <text class="danger-text" x="160" y="322">让 AI 自动执行</text>
  <text class="danger-code" x="160" y="342">rm -rf</text>

  <!-- Danger item 4: Unknown dependencies -->
  <rect class="danger-item" x="360" y="300" width="220" height="50" rx="8"/>
  <text class="danger-num" x="375" y="332">④</text>
  <text class="danger-text" x="400" y="322">让 AI 自动安装</text>
  <text class="danger-text" x="400" y="342">未知依赖</text>

  <!-- Warning triangle in center -->
  <polygon class="warning-icon" points="350,170 375,220 325,220"/>
  <text x="350" y="212" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>

  <!-- Bottom text -->
  <text class="bottom-text" x="350" y="420">AI 是你的同事，不是你的朋友</text>
  <line x1="200" y1="440" x2="500" y2="440" stroke="#dc2626" stroke-width="2"/>
</svg>
