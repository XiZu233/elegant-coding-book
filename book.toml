[book]
title = "AI时代的优雅编程"
authors = ["给零基础小白准备的AI时代优雅编程"]
description = "零基础读者通过与AI协作学习Python编程，掌握描述需求、生成代码、运行验证、迭代优化的完整工作流"
language = "zh"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
copy-fonts = true
no-section-label = false
site-url = "/elegant-coding-book/"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1

[output.html.playground]
editable = false

[rust]
edition = "2021"
