<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <style>
    .bg { fill: #f9fafb; }
    .node { fill: #ffffff; stroke-width: 2; }
    .node-explore { stroke: #2563eb; }
    .node-act { stroke: #059669; }
    .node-validate { stroke: #d97706; }
    .arrow { fill: none; stroke-width: 3; marker-end: url(#arrowhead); }
    .arrow-explore { stroke: #2563eb; }
    .arrow-act { stroke: #059669; }
    .arrow-validate { stroke: #d97706; }
    .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .node-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .node-title-explore { fill: #2563eb; }
    .node-title-act { fill: #059669; }
    .node-title-validate { fill: #d97706; }
    .node-subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #6b7280; text-anchor: middle; }
    .example { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; text-anchor: middle; }
    .icon { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-explore { stroke: #2563eb; }
    .icon-act { stroke: #059669; }
    .icon-validate { stroke: #d97706; }
    .loop-note { font-family: Arial, sans-serif; font-size: 13px; fill: #6b7280; text-anchor: middle; font-style: italic; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="520" rx="12"/>
  <text class="title" x="400" y="40">Agentic Loop 核心架构</text>

  <!-- Explore Node (top) -->
  <rect class="node node-explore" x="300" y="65" width="200" height="90" rx="16"/>
  <circle cx="400" cy="95" r="18" fill="#dbeafe"/>
  <!-- Magnifying glass icon -->
  <circle class="icon icon-explore" cx="400" cy="93" r="7"/>
  <line class="icon icon-explore" x1="405" y1="98" x2="410" y2="103"/>
  <text class="node-title node-title-explore" x="400" y="125">收集上下文</text>
  <text class="node-subtitle" x="400" y="142">Explore</text>

  <!-- Arrow: Explore -> Act -->
  <path class="arrow arrow-explore" d="M480 120 Q540 160 540 200" marker-end="url(#arrowhead)"/>

  <!-- Act Node (right) -->
  <rect class="node node-act" x="470" y="205" width="200" height="90" rx="16"/>
  <circle cx="570" cy="235" r="18" fill="#d1fae5"/>
  <!-- Hammer icon -->
  <rect class="icon icon-act" x="564" y="228" width="12" height="8" rx="1"/>
  <line class="icon icon-act" x1="570" y1="236" x2="570" y2="248"/>
  <text class="node-title node-title-act" x="570" y="265">采取行动</text>
  <text class="node-subtitle" x="570" y="282">Act</text>

  <!-- Arrow: Act -> Validate -->
  <path class="arrow arrow-act" d="M520 250 Q460 290 400 290" marker-end="url(#arrowhead)"/>

  <!-- Validate Node (bottom) -->
  <rect class="node node-validate" x="300" y="305" width="200" height="90" rx="16"/>
  <circle cx="400" cy="335" r="18" fill="#fef3c7"/>
  <!-- Checkmark icon -->
  <polyline class="icon icon-validate" points="393,335 397,340 407,330"/>
  <text class="node-title node-title-validate" x="400" y="365">验证结果</text>
  <text class="node-subtitle" x="400" y="382">Validate</text>

  <!-- Arrow: Validate -> Explore (loop back) -->
  <path class="arrow arrow-validate" d="M300 350 Q220 310 220 200 Q220 110 300 110" marker-end="url(#arrowhead)"/>

  <!-- Example actions below Explore -->
  <rect x="120" y="75" width="150" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text class="example" x="195" y="95">搜索文件</text>
  <text class="example" x="195" y="112">读取代码</text>
  <text class="example" x="195" y="129">理解项目结构</text>

  <!-- Example actions right of Act -->
  <rect x="690" y="215" width="150" height="70" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text class="example" x="765" y="235">编辑文件</text>
  <text class="example" x="765" y="252">运行命令</text>
  <text class="example" x="765" y="269">创建新文件</text>

  <!-- Example actions below Validate -->
  <rect x="120" y="315" width="150" height="70" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text class="example" x="195" y="335">运行测试</text>
  <text class="example" x="195" y="352">检查构建</text>
  <text class="example" x="195" y="369">对比预期输出</text>

  <!-- Loop note -->
  <text class="loop-note" x="400" y="470">循环会根据任务自动调整迭代次数，直到完成</text>
  <text class="loop-note" x="400" y="490" style="font-size:12px;">问问题可能只需一次；修复 Bug 可能循环多次</text>
</svg>
