<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <style>
    .bg { fill: #f9fafb; }
    .client-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .server-box { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .package { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .arrow-request { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowhead-blue); }
    .arrow-response { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .title-client { fill: #2563eb; }
    .title-server { fill: #059669; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #1f2937; text-anchor: middle; }
    .method { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; }
    .method-get { fill: #2563eb; }
    .method-post { fill: #059669; }
    .method-put { fill: #d97706; }
    .method-delete { fill: #dc2626; }
    .status-ok { font-family: Arial, sans-serif; font-size: 11px; fill: #059669; font-weight: bold; }
    .status-notfound { font-family: Arial, sans-serif; font-size: 11px; fill: #dc2626; font-weight: bold; }
    .arrow-label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .json-text { font-family: "Courier New", monospace; font-size: 9px; fill: #6b7280; }
  </style>

  <defs>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="700" height="420" rx="12"/>

  <!-- Client -->
  <rect class="client-box" x="50" y="60" width="180" height="280" rx="12"/>
  <text class="title title-client" x="140" y="90">客户端</text>
  <text class="label" x="140" y="110">（你的程序）</text>

  <!-- Client package box -->
  <rect class="package" x="80" y="140" width="120" height="80" rx="6"/>
  <rect x="80" y="140" width="120" height="20" rx="6" fill="#dbeafe"/>
  <text class="json-text" x="90" y="155">{ "method": "GET" }</text>
  <text class="json-text" x="90" y="175">{ "url": "/api/..." }</text>
  <text class="json-text" x="90" y="195">{ "headers": {...} }</text>
  <text class="json-text" x="90" y="210">...</text>

  <!-- Server -->
  <rect class="server-box" x="470" y="60" width="180" height="280" rx="12"/>
  <text class="title title-server" x="560" y="90">服务器</text>

  <!-- Server package box -->
  <rect class="package" x="500" y="140" width="120" height="80" rx="6"/>
  <rect x="500" y="140" width="120" height="20" rx="6" fill="#d1fae5"/>
  <text class="json-text" x="510" y="155">{ "status": 200 }</text>
  <text class="json-text" x="510" y="175">{ "data": {...} }</text>
  <text class="json-text" x="510" y="195">{ "headers": {...} }</text>
  <text class="json-text" x="510" y="210">...</text>

  <!-- Request arrow (top) -->
  <path class="arrow-request" d="M230 170 Q350 130 470 170"/>
  <text class="arrow-label" x="350" y="145" fill="#2563eb">请求</text>

  <!-- Method labels on request arrow -->
  <text class="method method-get" x="260" y="155">GET</text>
  <text class="method method-post" x="300" y="145">POST</text>
  <text class="method method-put" x="340" y="140">PUT</text>
  <text class="method method-delete" x="390" y="145">DELETE</text>

  <!-- Response arrow (bottom) -->
  <path class="arrow-response" d="M470 230 Q350 270 230 230"/>
  <text class="arrow-label" x="350" y="265" fill="#059669">响应</text>

  <!-- Status labels on response arrow -->
  <text class="status-ok" x="420" y="260">200 OK</text>
  <text class="status-notfound" x="360" y="270">404 Not Found</text>

  <!-- Legend -->
  <rect x="50" y="360" width="600" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text class="label" x="350" y="385">HTTP = 客户端和服务器之间的对话协议</text>
</svg>
