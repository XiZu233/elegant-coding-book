<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    .bg { fill: #f9fafb; }
    .panel-left { fill: #fef2f2; stroke: #fecaca; stroke-width: 2; }
    .panel-right { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
    .person-head { fill: #fbbf24; }
    .person-body { fill: #1f2937; }
    .ai-head { fill: #2563eb; }
    .ai-body { fill: #1e40af; }
    .code-line { stroke: #dc2626; stroke-width: 2; }
    .code-line-good { stroke: #2563eb; stroke-width: 2; }
    .arrow-line { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
    .title-left { fill: #dc2626; }
    .title-right { fill: #2563eb; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .label-left { fill: #991b1b; }
    .label-right { fill: #1e3a8a; }
    .center-text { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #059669; text-anchor: middle; }
    .pain { font-family: Arial, sans-serif; font-size: 24px; fill: #dc2626; }
    .happy { font-family: Arial, sans-serif; font-size: 24px; fill: #059669; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="400" rx="12"/>

  <!-- Left Panel: Traditional Programming -->
  <rect class="panel-left" x="30" y="30" width="320" height="340" rx="12"/>
  <text class="title title-left" x="190" y="65">传统编程</text>

  <!-- Person facing code, pain expression -->
  <circle class="person-head" cx="120" cy="130" r="25"/>
  <!-- Pain eyes -->
  <line x1="110" y1="125" x2="115" y2="130" stroke="#1f2937" stroke-width="2"/>
  <line x1="115" y1="125" x2="110" y2="130" stroke="#1f2937" stroke-width="2"/>
  <line x1="125" y1="125" x2="130" y2="130" stroke="#1f2937" stroke-width="2"/>
  <line x1="130" y1="125" x2="125" y2="130" stroke="#1f2937" stroke-width="2"/>
  <!-- Pain mouth -->
  <path d="M112 145 Q120 138 128 145" stroke="#1f2937" stroke-width="2" fill="none"/>
  <!-- Body -->
  <path class="person-body" d="M95 160 L95 220 L145 220 L145 160 Q145 155 120 155 Q95 155 95 160"/>
  <text class="pain" x="105" y="200">X</text>

  <!-- Code screen -->
  <rect x="170" y="110" width="150" height="120" rx="6" fill="#1f2937"/>
  <rect x="175" y="115" width="140" height="15" rx="3" fill="#374151"/>
  <circle cx="182" cy="122" r="3" fill="#ef4444"/>
  <circle cx="192" cy="122" r="3" fill="#f59e0b"/>
  <circle cx="202" cy="122" r="3" fill="#22c55e"/>
  <!-- Code lines -->
  <line class="code-line" x1="180" y1="145" x2="250" y2="145"/>
  <line class="code-line" x1="180" y1="158" x2="270" y2="158"/>
  <line class="code-line" x1="180" y1="171" x2="240" y2="171"/>
  <line class="code-line" x1="180" y1="184" x2="260" y2="184"/>
  <line class="code-line" x1="180" y1="197" x2="230" y2="197"/>
  <line class="code-line" x1="180" y1="210" x2="250" y2="210"/>

  <!-- Labels left -->
  <text class="label label-left" x="60" y="270">记忆语法</text>
  <text class="label label-left" x="60" y="290">手动调试</text>
  <text class="label label-left" x="60" y="310">逐行编写</text>

  <!-- Right Panel: AI Programming -->
  <rect class="panel-right" x="450" y="30" width="320" height="340" rx="12"/>
  <text class="title title-right" x="610" y="65">AI 编程</text>

  <!-- Person talking to AI -->
  <circle class="person-head" cx="500" cy="200" r="25"/>
  <!-- Happy eyes -->
  <circle cx="492" cy="195" r="3" fill="#1f2937"/>
  <circle cx="508" cy="195" r="3" fill="#1f2937"/>
  <!-- Happy mouth -->
  <path d="M490 210 Q500 220 510 210" stroke="#1f2937" stroke-width="2" fill="none"/>
  <!-- Body -->
  <path class="person-body" d="M475 230 L475 280 L525 280 L525 230 Q525 225 500 225 Q475 225 475 230"/>

  <!-- Speech bubble -->
  <rect x="540" y="130" width="180" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <polygon points="540,180 530,190 540,195" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="540" y1="180" x2="540" y2="195" stroke="#ffffff" stroke-width="2"/>
  <text class="label" x="555" y="155">"帮我写一个自动</text>
  <text class="label" x="555" y="175">整理文件的程序"</text>

  <!-- AI Robot -->
  <rect class="ai-body" x="650" y="140" width="60" height="50" rx="8"/>
  <rect class="ai-head" x="660" y="115" width="40" height="30" rx="6"/>
  <!-- AI eyes -->
  <circle cx="670" cy="130" r="4" fill="#ffffff"/>
  <circle cx="690" cy="130" r="4" fill="#ffffff"/>
  <!-- AI antenna -->
  <line x1="680" y1="115" x2="680" y2="105" stroke="#1e40af" stroke-width="2"/>
  <circle cx="680" cy="102" r="4" fill="#22c55e"/>
  <!-- AI arms -->
  <line x1="650" y1="160" x2="635" y2="175" stroke="#1e40af" stroke-width="3"/>
  <line x1="710" y1="160" x2="725" y2="175" stroke="#1e40af" stroke-width="3"/>
  <!-- Code generating from AI -->
  <rect x="640" y="200" width="80" height="60" rx="6" fill="#1f2937"/>
  <line class="code-line-good" x1="650" y1="215" x2="710" y2="215"/>
  <line class="code-line-good" x1="650" y1="228" x2="700" y2="228"/>
  <line class="code-line-good" x1="650" y1="241" x2="705" y2="241"/>
  <line class="code-line-good" x1="650" y1="254" x2="690" y2="254"/>

  <!-- Labels right -->
  <text class="label label-right" x="470" y="310">描述需求</text>
  <text class="label label-right" x="470" y="330">AI 实现</text>
  <text class="label label-right" x="470" y="350">人类验收</text>

  <!-- Center arrow -->
  <line class="arrow-line" x1="360" y1="200" x2="440" y2="200"/>
  <text class="center-text" x="400" y="190">范式转变</text>
</svg>
