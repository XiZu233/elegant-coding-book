<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <style>
    .bg { fill: #f9fafb; }
    .folder { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .file { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .root { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .tree-line { stroke: #9ca3af; stroke-width: 2; fill: none; }
    .abs-arrow { stroke: #dc2626; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
    .rel-arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .folder-label { font-family: Arial, sans-serif; font-size: 13px; fill: #1f2937; text-anchor: middle; }
    .file-label { font-family: Arial, sans-serif; font-size: 12px; fill: #1f2937; text-anchor: middle; }
    .abs-label { font-family: Arial, sans-serif; font-size: 12px; fill: #dc2626; font-weight: bold; }
    .rel-label { font-family: Arial, sans-serif; font-size: 12px; fill: #2563eb; font-weight: bold; }
    .note-box { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.5; }
    .note-text { font-family: Arial, sans-serif; font-size: 13px; fill: #991b1b; }
    .note-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #dc2626; }
  </style>

  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="800" height="480" rx="12"/>
  <text class="title" x="400" y="35">文件系统路径</text>

  <!-- Tree structure -->
  <!-- Root -->
  <rect class="root" x="360" y="55" width="80" height="36" rx="6"/>
  <text class="folder-label" x="400" y="78" style="font-weight:bold;">/</text>

  <!-- Line root -> home -->
  <line class="tree-line" x1="400" y1="91" x2="400" y2="115"/>
  <line class="tree-line" x1="280" y1="115" x2="520" y2="115"/>

  <!-- home folder -->
  <line class="tree-line" x1="280" y1="115" x2="280" y2="135"/>
  <rect class="folder" x="240" y="135" width="80" height="36" rx="6"/>
  <text class="folder-label" x="280" y="158">home/</text>

  <!-- user folder -->
  <line class="tree-line" x1="280" y1="171" x2="280" y2="195"/>
  <line class="tree-line" x1="200" y1="195" x2="360" y2="195"/>
  <line class="tree-line" x1="200" y1="195" x2="200" y2="215"/>
  <rect class="folder" x="160" y="215" width="80" height="36" rx="6"/>
  <text class="folder-label" x="200" y="238">user/</text>

  <!-- project folder -->
  <line class="tree-line" x1="200" y1="251" x2="200" y2="275"/>
  <line class="tree-line" x1="120" y1="275" x2="280" y2="275"/>
  <line class="tree-line" x1="120" y1="275" x2="120" y2="295"/>
  <rect class="folder" x="80" y="295" width="80" height="36" rx="6"/>
  <text class="folder-label" x="120" y="318">project/</text>

  <!-- data.txt file -->
  <line class="tree-line" x1="120" y1="331" x2="120" y2="355"/>
  <rect class="file" x="70" y="355" width="100" height="36" rx="6"/>
  <text class="file-label" x="120" y="378">data.txt</text>

  <!-- Absolute path arrow (red, from root to file) -->
  <path class="abs-arrow" d="M450 73 Q580 73 580 200 Q580 373 180 373"/>
  <text class="abs-label" x="620" y="200">绝对路径 = /home/user/project/data.txt</text>

  <!-- Relative path arrow (blue, from project to file) -->
  <path class="rel-arrow" d="M170 313 Q40 313 40 373 Q40 433 70 433"/>
  <text class="rel-label" x="40" y="420">相对路径（从 project 出发）= ./data.txt</text>

  <!-- Right side note -->
  <rect class="note-box" x="480" y="280" width="280" height="80" rx="10"/>
  <text class="note-title" x="500" y="305">注意</text>
  <text class="note-text" x="500" y="325">Agent 报错"找不到文件"，</text>
  <text class="note-text" x="500" y="345">80% 是站错地方了。</text>
</svg>
